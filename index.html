<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="src/index.css" />
    <script src="https://unpkg.com/axios@1.6.7/dist/axios.min.js"></script>
    <title>My weather application</title>
  </head>
  <body>
    <header class="body">
      <header>
        <form id="form">
          <input
            type="search"
            id="input-form"
            placeholder="Enter a city.."
            required
          />
          <input type="submit" value="Search" class="go" />
        </form>
        <hr />
      </header>
      <main>
        <div class="current-weather">
          <div class = "left">
            <span id="day"> Saturday &nbsp;<strong>15:32</strong></span>
            <h2>City</h2>
            <h1 class="tempr">
                <span class="temp-value">...</span>°
                <span class="temp-icon"><img id="weather-icon" src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTYo2wP2PjcnTZ2PGNz25XhaV-PQgGEZC3cuD1klihnSA&s" alt="weather icon" /></span>
            </h1>

            <span class="weather"><small></small></span>
          </div >
          <div class = "right">
            <span class="rain">
              ...<br /></span>,
              <span class="humidity">Humidity ...% </span>
              <br />
             <span class="wind"> Windspeed: ...</span>
          </div>
        </div>
        <div class="forecast" id="foreCast"></div>
      </main>
      <footer>
        <p class="links">
          <small
            >This project was coded by
            <a href="https://github.com/khaare" target="_blank">Khaarendiwe</a> and is
            <a href="https://github.com/khaare/SheCodes" target="_blank">
              on GitHub</a
            >
            and
            <a
              href="https://weatherappforshecodes.netlify.app/"
              target="_blank"
              >hosted on Netlify</a
            ></small
          >
        </p>
        <hr />
      </footer>
    </header>
    <script src="index.js"></script>
  </body>
</html>
